services:
  gateway-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [gateway-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway-service:
    build: ./gateway-service
    environment:
      GATEWAY_DATABASE_URL: jdbc:postgresql://gateway-db:5432/gateway_db
      GATEWAY_DATABASE_USERNAME: ${POSTGRES_USER:-gateway}
      GATEWAY_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      GATEWAY_SWITCH_MODE: ${GATEWAY_SWITCH_MODE:-local-simulator}
      GATEWAY_SWITCH_HOST: ${GATEWAY_SWITCH_HOST:-}
      GATEWAY_SWITCH_PORT: ${GATEWAY_SWITCH_PORT:-0}
      GATEWAY_SWITCH_TLS: ${GATEWAY_SWITCH_TLS:-false}
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:8082,http://localhost:8083
      PORTAL_GATEWAY_KEY: ${PORTAL_GATEWAY_KEY:?set PORTAL_GATEWAY_KEY}
    depends_on:
      gateway-db: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8081"]

  developer-portal:
    build: ./developer-portal
    depends_on: [gateway-service]
    environment:
      PORTAL_GATEWAY_URL: http://gateway-service:8081/api/gateway
      PORTAL_GATEWAY_KEY: ${PORTAL_GATEWAY_KEY:?set PORTAL_GATEWAY_KEY}
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-http://localhost:8082}
      PORTAL_GOOGLE_CLIENT_ID: ${PORTAL_GOOGLE_CLIENT_ID:-}
      PORTAL_GOOGLE_CLIENT_SECRET: ${PORTAL_GOOGLE_CLIENT_SECRET:-}
    volumes: [portal-data:/data]
    ports: ["8082:8082"]

volumes:
  gateway-db-data:
  portal-data:
