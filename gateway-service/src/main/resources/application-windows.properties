spring.datasource.url=jdbc:h2:file:./.local-data/gateway-db;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8081
server.address=127.0.0.1
server.servlet.context-path=/api/gateway
gateway.switch.mode=local-simulator
gateway.cors.allowed-origins=http://localhost:8082,http://localhost:8083
gateway.portal.jwt-secret=${PORTAL_JWT_SECRET:${JWT_AUTH_SECRET:local-development-secret-must-be-over-32-characters}}
