spring.application.name=gateway-service
server.port=8081
server.servlet.context-path=/api/gateway
# local-simulator is the only enabled connector. Use a certified adapter before changing this value.
gateway.switch.mode=local-simulator
# Set GATEWAY_SWITCH_MODE=tcp plus the host/port only for an approved bank test endpoint.
gateway.switch.host=${GATEWAY_SWITCH_HOST:}
gateway.switch.port=${GATEWAY_SWITCH_PORT:0}
gateway.switch.tls=${GATEWAY_SWITCH_TLS:false}
gateway.switch.connect-timeout-ms=${GATEWAY_SWITCH_CONNECT_TIMEOUT_MS:5000}
gateway.switch.read-timeout-ms=${GATEWAY_SWITCH_READ_TIMEOUT_MS:30000}
gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:8082,http://localhost:8083}
# Local default is for bank testing only. Production must set GATEWAY_DATABASE_URL and use managed PostgreSQL.
spring.datasource.url=${GATEWAY_DATABASE_URL:jdbc:h2:mem:gateway;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${GATEWAY_DATABASE_USERNAME:sa}
spring.datasource.password=${GATEWAY_DATABASE_PASSWORD:}
# Local development may use update. Production must use validated versioned migrations.
spring.jpa.hibernate.ddl-auto=${GATEWAY_SCHEMA_MODE:update}
gateway.portal.jwt-secret=${PORTAL_JWT_SECRET:}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
