# ===============================
# Application
# ===============================
spring.application.name=authservice

# ===============================
# Database Connection (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DEV ONLY: create schema on startup (use 'update' later)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===============================
# Hibernate Schema Control
# ===============================
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Debug (IMPORTANT for your case)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG

#secret key for the jwp auth key
jwt.auth.secret=${JWT_AUTH_SECRET:4Y2KxG7H8l9QpZ3fTn6VbR2xN8hC0sJk}

#key for the encryption
jwt.encryption.secret=H7sJkP0tQ3fN2xV6bTn9Z8lG7hC2Y1kR

server.servlet.context-path=/api/auth-service

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=*

# SMTP is supplied only through deployment environment variables. Never commit SMTP passwords.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@example.invalid}
app.account-actions.public-url=${PORTAL_PUBLIC_URL:http://localhost:4200}

# Local bootstrap account. Override these values with environment variables in deployment.
app.bootstrap-admin.enabled=true
app.bootstrap-admin.username=admin
app.bootstrap-admin.password=Admin@123
app.bootstrap-admin.email=admin@localhost

# Gateway defaults are deliberately fail-closed. SmartVista/HSM adapters must be configured and certified
# before simulation can ever be enabled in a non-development environment.
gateway.smartvista.simulation-enabled=false
gateway.terminals.offline-after-seconds=180
gateway.terminals.monitor-interval-ms=30000
