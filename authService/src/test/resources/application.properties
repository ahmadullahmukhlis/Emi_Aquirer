spring.datasource.url=jdbc:h2:mem:gateway_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.main.banner-mode=off
gateway.smartvista.simulation-enabled=false
app.bootstrap-admin.enabled=false
jwt.auth.secret=test-auth-secret-at-least-thirty-two-characters-long
jwt.encryption.secret=test-encryption-secret-at-least-thirty-two-characters
